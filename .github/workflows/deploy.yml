name: Deploy to Linux server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24
  DEPLOY_PATH: /var/www/nextapp-autoparts

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: >-
          npm ci
          --workspace=apps/NextApp-CRM
          --workspace=apps/NextApp-API
          --workspace=packages/shared-types
          --include-workspace-root

      - name: Restore Linux Rollup native dependency
        run: |
          npm install --no-save --package-lock=false --include=optional --ignore-scripts \
            @rollup/rollup-linux-x64-gnu@4.63.3
          node -e "require.resolve('@rollup/rollup-linux-x64-gnu'); console.log('Linux Rollup native dependency is available')"

      - name: Build CRM
        env:
          VITE_API_URL: https://yogrind.shop/api
          VITE_APP_NAME: NextApp Auto Parts CMS
          VITE_APP_VERSION: ${{ github.sha }}
        run: npm run build --workspace=apps/NextApp-CRM

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust deployment host
        run: ssh-keyscan -p "${{ secrets.DEPLOY_PORT || 22 }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare server directory
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT || 22 }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p '${{ env.DEPLOY_PATH }}'"

      - name: Upload application
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.DEPLOY_PORT || 22 }}" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'apps/NextApp-Mobile/' \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/"

      - name: Configure production environment
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$DB_PASSWORD" ] || [ -z "$JWT_SECRET" ]; then
            echo "DB_PASSWORD and JWT_SECRET GitHub Secrets are required."
            exit 1
          fi

          env_payload="$(printf 'NODE_ENV=production\nPORT=3001\nDB_HOST=127.0.0.1\nDB_PORT=3306\nDB_NAME=nextapp_crm\nDB_USER=nextapp_user\nDB_PASSWORD=%s\nJWT_SECRET=%s\nWEB_ORIGINS=https://yogrind.shop\n' "$DB_PASSWORD" "$JWT_SECRET" | base64 -w 0)"
          ssh -p "${{ secrets.DEPLOY_PORT || 22 }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p '${{ env.DEPLOY_PATH }}/apps/NextApp-API' && echo '$env_payload' | base64 -d > '${{ env.DEPLOY_PATH }}/apps/NextApp-API/.env' && chmod 600 '${{ env.DEPLOY_PATH }}/apps/NextApp-API/.env'"

      - name: Configure Nginx SPA routing
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT || 22 }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" <<'REMOTE'
          set -e
          sudo tee /etc/nginx/sites-available/nextapp-autoparts >/dev/null <<'NGINX'
          server {
              listen 80;
              server_name yogrind.shop;

              root /var/www/nextapp-autoparts/apps/NextApp-CRM/dist;
              index index.html;

              location /api/ {
                  proxy_pass http://127.0.0.1:3001;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location /assets/ {
                  try_files $uri =404;
                  add_header Cache-Control "public, max-age=31536000, immutable";
              }

              location = /index.html {
                  add_header Cache-Control "no-cache, no-store, must-revalidate";
                  try_files $uri =404;
              }

              location / {
                  try_files $uri $uri/ /index.html;
              }
          }
          NGINX
          sudo ln -sfn /etc/nginx/sites-available/nextapp-autoparts /etc/nginx/sites-enabled/nextapp-autoparts
          sudo nginx -t
          sudo systemctl reload nginx
          REMOTE

      - name: Install production dependencies and restart API
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT || 22 }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" <<'REMOTE'
          set -e
          cd "${{ env.DEPLOY_PATH }}"
          pwd
          ls -la
          ls -la apps/NextApp-API apps/NextApp-CRM packages/shared-types
          test -f package.json
          test -d apps/NextApp-API
          test -f apps/NextApp-API/package.json
          npm pkg get workspaces
          npm ci --omit=dev \
            --workspace=apps/NextApp-API \
            --workspace=packages/shared-types \
            --include-workspace-root
          npm run migrate --workspace=apps/NextApp-API
          pm2 delete nextapp-api >/dev/null 2>&1 || true
          pm2 start index.js --name nextapp-api --cwd "${{ env.DEPLOY_PATH }}/apps/NextApp-API" --update-env
          pm2 save
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:3001/api/health
          REMOTE

      - name: Check deployed API
        run: curl --fail --silent --show-error https://yogrind.shop/api/health
